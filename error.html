<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not Found | Stackly Jewellery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#0b0a08;
    --obsidian-2:#141210;
    --ivory:#f3ecdd;
    --ivory-dim:#d9cfb8;
    --gold:#c6a15b;
    --gold-bright:#e9caa0;
    --emerald:#12463a;
    --copper:#b76e51;
    --line: rgba(243,236,221,0.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--obsidian);
    color: var(--ivory);
    font-family:'Jost', sans-serif;
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 40px 24px;
    background:
      radial-gradient(circle at 50% 18%, rgba(198,161,91,0.10), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(18,70,58,0.18), transparent 50%),
      linear-gradient(180deg, var(--obsidian) 0%, var(--obsidian-2) 100%);
  }

  /* ambient drifting dust / light flecks */
  .flecks{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .fleck{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background: var(--gold-bright);
    opacity:0.35;
    filter: blur(0.3px);
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0px) translateX(0px); opacity:0.15; }
    50%{ transform:translateY(-26px) translateX(10px); opacity:0.55; }
  }

  .frame{
    position:relative;
    z-index:1;
    width:100%;
    max-width:620px;
    text-align:center;
    padding: 64px 44px 52px;
    border:1px solid var(--line);
    background: linear-gradient(180deg, rgba(20,18,16,0.6), rgba(11,10,8,0.4));
    backdrop-filter: blur(2px);
  }

  .frame::before,
  .frame::after{
    content:"";
    position:absolute;
    width:26px; height:26px;
    border: 1px solid var(--gold);
    opacity:0.7;
  }
  .frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .frame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .corner-tl, .corner-br{
    position:absolute;
    width:26px; height:26px;
    border: 1px solid var(--gold);
    opacity:0.7;
  }
  .corner-tl{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .corner-br{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  /* signature: fractured gem */
  .gem-wrap{
    position:relative;
    width:180px;
    margin:0 auto 8px;
  }

  .gem-wrap svg{
    width:100%;
    height:auto;
    overflow:visible;
  }

  .facet{
    fill: none;
    stroke: var(--gold);
    stroke-width: 1;
    opacity:0.75;
  }
  .facet-fill{
    fill: var(--emerald);
    fill-opacity: 0.35;
    stroke: var(--gold-bright);
    stroke-width: 1.1;
  }
  .facet-fill.shard{
    animation: shimmer 4.2s ease-in-out infinite;
  }
  .facet-fill.shard.b{ animation-delay: 0.6s; }
  .facet-fill.shard.c{ animation-delay: 1.3s; }
  @keyframes shimmer{
    0%,100%{ fill-opacity:0.28; }
    50%{ fill-opacity:0.55; }
  }

  .crack{
    stroke: var(--copper);
    stroke-width: 1.4;
    fill:none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px rgba(183,110,81,0.55));
  }

  .glint{
    position:absolute;
    top:6%;
    left:52%;
    width:5px; height:5px;
    background: var(--gold-bright);
    border-radius:50%;
    box-shadow: 0 0 10px 2px var(--gold-bright);
    animation: glint 3.4s ease-in-out infinite;
  }
  @keyframes glint{
    0%,20%,100%{ opacity:0; transform:scale(0.6); }
    10%{ opacity:1; transform:scale(1.15); }
  }

  .eyebrow{
    display:block;
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:0.34em;
    text-transform:uppercase;
    color: var(--gold);
    margin: 26px 0 10px;
  }

  .code{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(52px, 11vw, 84px);
    line-height:1;
    letter-spacing:0.06em;
    color: var(--ivory);
    text-shadow: 0 0 26px rgba(198,161,91,0.18);
  }

  .code em{
    font-style:italic;
    color: var(--gold-bright);
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(24px, 4vw, 30px);
    margin: 18px 0 14px;
    color: var(--ivory);
  }

  p.copy{
    font-size:15px;
    line-height:1.75;
    color: var(--ivory-dim);
    max-width:420px;
    margin: 0 auto 34px;
    font-weight:300;
  }

  .divider{
    width:64px;
    height:1px;
    margin: 0 auto 28px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .actions{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Jost', sans-serif;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    text-decoration:none;
    padding: 15px 30px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition: all 0.35s ease;
  }

  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  .btn-primary{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--obsidian);
    box-shadow: 0 8px 24px -10px rgba(198,161,91,0.55);
  }
  .btn-primary:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -8px rgba(198,161,91,0.7);
  }

  .btn-ghost{
    background: transparent;
    color: var(--ivory);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover{
    border-color: var(--gold);
    color: var(--gold-bright);
    transform: translateY(-2px);
  }

  .btn:focus-visible{
    outline: 1.5px solid var(--gold-bright);
    outline-offset: 3px;
  }

  .foot-note{
    margin-top:34px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: rgba(217,207,184,0.4);
  }

  @media (prefers-reduced-motion: reduce){
    .fleck, .facet-fill.shard, .glint{ animation:none !important; }
  }

  @media (max-width:520px){
    .frame{ padding: 52px 22px 40px; }
    .actions{ flex-direction:column; }
    .btn{ width:100%; justify-content:center; }
  }
</style>
</head>
<body>

  <div class="flecks">
    <span class="fleck" style="top:20%; left:12%; animation-delay:0s;"></span>
    <span class="fleck" style="top:65%; left:8%; animation-delay:2s;"></span>
    <span class="fleck" style="top:30%; left:88%; animation-delay:4s;"></span>
    <span class="fleck" style="top:75%; left:90%; animation-delay:1s;"></span>
    <span class="fleck" style="top:50%; left:50%; animation-delay:3s;"></span>
    <span class="fleck" style="top:12%; left:60%; animation-delay:5s;"></span>
  </div>

  <main class="frame">
    <span class="corner-tl"></span>
    <span class="corner-br"></span>

    <div class="gem-wrap">
      <div class="glint"></div>
      <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
        <!-- emerald-cut gem, fractured into shards -->
        <polygon class="facet-fill shard a" points="100,8 150,34 100,84 58,60" />
        <polygon class="facet-fill shard b" points="150,34 178,70 118,90 100,84" />
        <polygon class="facet-fill shard c" points="58,60 100,84 90,140 40,100" />
        <polygon class="facet-fill shard" points="100,84 118,90 132,150 90,140" />
        <polygon class="facet-fill shard b" points="118,90 178,70 160,120 132,150" />

        <polygon class="facet" points="100,8 150,34 178,70 160,120 132,150 90,140 40,100 58,60" />
        <line class="facet" x1="100" y1="8" x2="100" y2="84" />
        <line class="facet" x1="58" y1="60" x2="100" y2="84" />
        <line class="facet" x1="150" y1="34" x2="100" y2="84" />
        <line class="facet" x1="118" y1="90" x2="100" y2="84" />
        <line class="facet" x1="90" y1="140" x2="100" y2="84" />

        <!-- crack running through the stone -->
        <path class="crack" d="M100,8 L92,44 L112,58 L84,96 L104,118 L96,150" />
      </svg>
    </div>

    <span class="eyebrow">Stackly Jewellery</span>
    <div class="code">4<em>0</em>4</div>
    <h1>This piece has slipped its setting.</h1>
    <div class="divider"></div>
    <p class="copy">
      The page you were looking for isn't in our collection — moved, renamed,
      or perhaps never set in place. Let's guide you back to safer ground.
    </p>

    <div class="actions">
      <button class="btn btn-ghost" id="goBackBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M11 18l-6-6 6-6"/>
        </svg>
        Go Back
      </button>
      <a class="btn btn-primary" href="index.html">
        Return Home
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>
      </a>
    </div>

    <p class="foot-note">Error Code · 404 — Not Found</p>
  </main>

  <script>
    document.getElementById('goBackBtn').addEventListener('click', function(){
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
